version: '3.8'

services:
  cinemanager-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cinemanager_rest_api
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
